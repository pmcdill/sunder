<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Request an estimate from Sunder Construction. Send a few details about your house and project.">
<meta name="theme-color" content="#ebddc9">
<link rel="icon" href="assets/sunder-spiral.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&amp;family=Rokkitt:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<script src="js/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="site">
<img class="bg-mark is-on" src="assets/sunder-spiral.svg" alt="" aria-hidden="true">
<header class="nav">
<div class="wrap nav-in">
<a class="nav-logo" href="index.html" aria-label="Sunder home"><img src="assets/sunder-wordmark.svg" alt="Sunder" width="170" height="44"></a>
<nav class="nav-links" aria-label="Main">

<a href="contact.html" aria-current="page">Contact</a>
<span class="nav-ul" aria-hidden="true"></span>
</nav>
</div>
</header>

<main id="main">
<section class="wrap contact">
<div class="contact-info">
<h1 class="page-title line"><span class="accent">Let’s</span> talk.</h1>
<p class="lead">Send a few details about the house and the project. We reply within [two business days] to set up a walkthrough.</p>
<div class="contact-lines">
<a href="tel:+10000000000">[Phone]</a>
<a href="mailto:hello@example.com">[Email]</a>
<span>Serving [service area]</span>
</div>
</div>
<div class="contact-card">
<!--
  JobTread web form: submissions become leads in Sunder's JobTread account.
  JobTread's script (web-form.js, loaded below) finds this form by data-jobtread-web-form and posts it.
  Restyled to match the site. Do NOT change: the data-* attributes on <form> and the submit button,
  any field "name", or the Project type option text (they map to JobTread fields).
  The thank-you text is data-success-message; it can also be edited in JobTread.
-->
<form class="jtwf form" id="estimate-form" data-jobtread-web-form="true" data-key="22TcevGstXqnFSppGbxkJBGznvcLyyrP5s" data-success-message="Thanks! We will follow up soon.">
<div class="field">
<label for="f-name">Name <span class="req">(required)</span></label>
<input id="f-name" name="contact.name" type="text" autocomplete="name" required aria-describedby="f-name-err">
<p class="field-error" id="f-name-err" hidden></p>
</div>
<div class="field">
<label for="f-email">Email</label>
<input id="f-email" name="contact.custom.22PfzRCeVRmx" type="email" autocomplete="email" aria-describedby="f-email-err">
<p class="field-error" id="f-email-err" hidden></p>
</div>
<div class="field">
<label for="f-phone">Phone <span class="req">(required)</span></label>
<input id="f-phone" name="contact.custom.22PfzRCeY45y" type="tel" autocomplete="tel" required aria-describedby="f-phone-err">
<p class="field-error" id="f-phone-err" hidden></p>
</div>
<div class="field">
<label for="f-type">Project type</label>
<select id="f-type" name="job.custom.22PgAPYSQ9Zt" aria-describedby="f-type-err"><option value="">Choose one</option><option>New Construction</option><option>Remodel</option><option>Maintenance / Repair</option><option>Service</option><option>Finish Carpentry/Custom Woodworking</option><option>Other</option></select>
<p class="field-error" id="f-type-err" hidden></p>
</div>
<div class="field field-wide">
<label for="f-address">Project address <span class="req">(required)</span></label>
<textarea id="f-address" name="location.address" rows="2" autocomplete="street-address" required aria-describedby="f-address-err"></textarea>
<p class="field-error" id="f-address-err" hidden></p>
</div>
<div class="field field-wide">
<label for="f-message">Tell us about the project <span class="req">(required)</span></label>
<textarea id="f-message" name="job.description" rows="5" required aria-describedby="f-message-err"></textarea>
<p class="field-error" id="f-message-err" hidden></p>
</div>
<div class="field field-wide">
<label for="f-files">Files &amp; photos <span class="req">(optional)</span></label>
<input id="f-files" name="account.files" type="file" multiple>
</div>
<div class="field-wide"><button class="btn btn-primary" type="submit" data-submit-button="true">Send</button></div>
</form>
<script async src="https://app.jobtread.com/web-form.js"></script>
</div>
</section>
</main>
</div>
</body>
</html>
